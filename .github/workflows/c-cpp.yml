name: C/C++ CI

on: [push]

permissions:
  contents: read

jobs:
  build-artifact:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/classpaddev/hollyhock-3:v2.2.1
      credentials:
       username: ${{ github.actor }}
       password: ${{ secrets.github_token }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - run: make -j
    - uses: actions/upload-artifact@v4
      with:
        path: dist/**
